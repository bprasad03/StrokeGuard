<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Risk Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#0e7490',
                        'secondary': '#f97316',
                        'success': '#10b981',
                        'danger': '#ef4444',
                    }
                }
            }
        }
    </script>

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 md:p-10 border border-gray-200">
        <h1 class="text-3xl font-extrabold text-primary mb-6 border-b pb-2">
            Stroke Risk Prediction (LDA Model)
        </h1>

        <form action="/predict" method="post" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Age -->
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age (Years)</label>
                    <input type="number" step="0.1" id="age" name="age" required 
                           placeholder="e.g., 58.0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                </div>

                <!-- Gender -->
                <div>
                    <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                    <select id="gender" name="gender" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Hypertension -->
                <div>
                    <label for="hypertension" class="block text-sm font-medium text-gray-700 mb-1">Hypertension (0=No, 1=Yes)</label>
                    <select id="hypertension" name="hypertension" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                        <option value="0">0 (No)</option>
                        <option value="1">1 (Yes)</option>
                    </select>
                </div>

                <!-- Heart Disease -->
                <div>
                    <label for="heart_disease" class="block text-sm font-medium text-gray-700 mb-1">Heart Disease (0=No, 1=Yes)</label>
                    <select id="heart_disease" name="heart_disease" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                        <option value="0">0 (No)</option>
                        <option value="1">1 (Yes)</option>
                    </select>
                </div>
                
                <!-- Ever Married -->
                <div>
                    <label for="ever_married" class="block text-sm font-medium text-gray-700 mb-1">Ever Married</label>
                    <select id="ever_married" name="ever_married" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Avg Glucose Level -->
                <div>
                    <label for="avg_glucose_level" class="block text-sm font-medium text-gray-700 mb-1">Avg Glucose Level (mg/dL)</label>
                    <input type="number" step="0.01" id="avg_glucose_level" name="avg_glucose_level" required 
                           placeholder="e.g., 120.5"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                </div>
                
                <!-- BMI -->
                <div>
                    <label for="bmi" class="block text-sm font-medium text-gray-700 mb-1">BMI (Optional)</label>
                    <input type="number" step="0.1" id="bmi" name="bmi" 
                           placeholder="e.g., 25.4 (Leave blank if unknown)"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                </div>

                <!-- Residence Type -->
                <div>
                    <label for="Residence_type" class="block text-sm font-medium text-gray-700 mb-1">Residence Type</label>
                    <select id="Residence_type" name="Residence_type" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                        <option value="Urban">Urban</option>
                        <option value="Rural">Rural</option>
                    </select>
                </div>
            </div>

            <!-- Work Type -->
            <div>
                <label for="work_type" class="block text-sm font-medium text-gray-700 mb-1">Work Type</label>
                <select id="work_type" name="work_type" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                    <option value="Private">Private</option>
                    <option value="Self-employed">Self-employed</option>
                    <option value="Govt_job">Govt_job</option>
                    <option value="children">Children (under 18)</option>
                    <option value="Never_worked">Never_worked</option>
                </select>
            </div>
            
            <!-- Smoking Status -->
            <div>
                <label for="smoking_status" class="block text-sm font-medium text-gray-700 mb-1">Smoking Status</label>
                <select id="smoking_status" name="smoking_status" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150">
                    <option value="never smoked">Never Smoked</option>
                    <option value="formerly smoked">Formerly Smoked</option>
                    <option value="smokes">Smokes</option>
                    <option value="Unknown">Unknown</option>
                </select>
            </div>

            <button type="submit" 
                    class="w-full flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-secondary hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition duration-150 ease-in-out">
                Predict Stroke Risk
            </button>
        </form>

        <!-- Prediction Result Display -->
        {% if prediction %}
            <div class="mt-8 p-6 rounded-xl 
                {% if prediction.probability|replace('%', '')|float > 50 %}
                    bg-danger/10 border-2 border-danger
                {% else %}
                    bg-success/10 border-2 border-success
                {% endif %}
            ">
                <h2 class="text-2xl font-bold 
                    {% if prediction.probability|replace('%', '')|float > 50 %}
                        text-danger
                    {% else %}
                        text-success
                    {% endif %}
                    mb-3 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.618a8.62 8.62 0 011.979 2.083 8.62 8.62 0 01-1.979 12.083l-8.6 8.6a2 2 0 01-2.828 0l-8.6-8.6a8.62 8.62 0 011.979-12.083c3.673-3.673 9.637-3.673 13.31 0z"></path>
                    </svg>
                    Prediction Result
                </h2>
                
                <p class="text-gray-700 text-lg">
                    The predicted probability of stroke is: 
                    <span class="font-extrabold text-xl 
                        {% if prediction.probability|replace('%', '')|float > 50 %}
                            text-danger
                        {% else %}
                            text-success
                        {% endif %}
                    ">
                        {{ prediction.probability }}
                    </span>
                </p>
                <p class="text-gray-700 mt-1">
                    Risk Assessment: <span class="font-semibold">{{ prediction.outcome }}</span>
                </p>
                <p class="text-gray-500 text-xs mt-3">
                    Model Used: {{ prediction.model_type }}
                </p>
            </div>
        {% endif %}
    </div>

</body>
</html>
